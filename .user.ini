; Raise PHP's upload ceiling for the onboarding form's logo uploads.
; The host's default post_max_size (~3M) silently discards any larger POST,
; which surfaced as bogus "Unauthorized" errors. .user.ini applies under
; CGI/FastCGI/FPM (typical shared hosting) and is harmlessly ignored under
; mod_php; values may take up to user_ini.cache_ttl (default 300s) to apply.
upload_max_filesize = 25M
post_max_size = 30M
